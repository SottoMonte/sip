name: Contract gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install framework
        run: python -m pip install -e .

      - name: Run DSL test suite
        run: python3 public/main.py --test

      - name: Check generated contracts
        run: |
          if ! git diff --exit-code -- '**/*.contract.json' '**/*.json'; then
            echo "::error::I contract non sono allineati all'ultima esecuzione dei test. Esegui 'python3 public/main.py --test' in locale e committa i contract rigenerati."
            exit 1
          fi